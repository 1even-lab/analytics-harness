schema_version: "1.1"
name: dashboard-no-reask
description: "'Dashboard' is already a format - it isn't asked for again"
tags: [presentation]
execution:
  max_turns: 15
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Build a dashboard on GGR and active players for September 2026."
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dashboard"'
    min: 1
    weight: 1
