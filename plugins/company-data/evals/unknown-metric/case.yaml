schema_version: "1.1"
name: unknown-metric
description: The metric is not in the catalog - the agent doesn't silently invent a formula
tags: [metrics]
execution:
  max_turns: 15
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "Compute player LTV for Q3 2026."
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?metrics-catalog"'
    min: 1
    weight: 1
